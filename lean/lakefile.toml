name = "robot_arm"
version = "0.1.0"
defaultTargets = ["TorqueWrench", "Kinematics", "Dynamics", "Atan2", "Zyz", "InverseKinematics"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "TorqueWrench"

# Forward kinematics of the supported arm: poses, the DH transform, the chain and its
# cumulative frames (the tower `kinematics.py`'s `forward_kinematics` returns and the
# simulator draws), the planar reduction, the wrist's ZYZ entries and the angle congruence
# that `InverseKinematics.lean` builds on.
[[lean_lib]]
name = "Kinematics"

# Inertia, gravity and the sensor measurement model, built on `TorqueWrench`; still a pure
# proof library, so it is in `defaultTargets` with it.
[[lean_lib]]
name = "Dynamics"

# The closed-form inverse solver of `kinematics.py`'s `inverse_kinematics`: soundness (it
# returns exactly the poses it claims to) and completeness (a commanded configuration outside
# the degenerate cases comes back with every angle equal modulo a full turn). A pure proof
# library, so it is in `defaultTargets` with the others.
[[lean_lib]]
name = "InverseKinematics"

# The ZYZ/wrist facts the closed form consumes, read in both directions: the half-turn
# conjugation, the mirror identity that collapses the two wrist branches into one, the four
# remaining ZYZ entries and the missing direction of orthogonality, and - the way a completeness
# proof needs them - the read-backs saying the `atan2` entries determine the ZYZ angles, and the
# singularity split that makes holding `theta4` at zero lose no reachability.
[[lean_lib]]
name = "Zyz"

# `hypot`, `atan2` and `_wrap_angle` for the reals, with the angle algebra of the planar solve:
# the length of a scaled cosine/sine pair, the two scalings an angle read off a pair costs, and
# the elbow's `arccos` round trip. Mathlib has no `atan2` at all, and the solver is written in
# terms of it, so this is gap fill with no robot content of its own: `atan2` is `Complex.arg`,
# whose convention is exactly `math.atan2`'s.
[[lean_lib]]
name = "Atan2"

# Evaluates the transforms on the exact-rational cases and writes
# ../test_data/force_torque_frames.json. Not in `defaultTargets`: `lake build` stays a
# pure proof build, and the generator is compiled on demand by `lake exe`.
[[lean_exe]]
name = "force_torque_test_data"
root = "ForceTorqueTestData"

# Evaluates the forward chain on the exact-rational cases and writes
# ../test_data/kinematics_frames.json. Not in `defaultTargets`, for the same reason as
# `force_torque_test_data`: it is data, not a proof, and `lake exe` compiles it on demand.
[[lean_exe]]
name = "kinematics_test_data"
root = "KinematicsTestData"
