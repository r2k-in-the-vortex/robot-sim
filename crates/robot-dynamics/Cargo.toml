[package]
name = "robot-dynamics"
description = "Wrench/twist frame algebra and the force/torque sensor measurement model, written against the Lean specification in lean/TorqueWrench.lean and lean/Dynamics.lean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No features, and no third-party dependency. Everything here is polynomial in the
# inputs, so the crate is `Field`-generic, `no_std` throughout, and evaluable over the
# exact rationals `robot-golden` supplies without any flag being turned on.

[dependencies]
robot-kinematics = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
robot-golden.workspace = true
serde_json = "1"
